name: Build Image with Tests + Run Tests

on: workflow_dispatch

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build docker Image
        run: docker build -t ai-driven-qa:ci .
      - name: Run container with Tests
        env:
          REAL_WORLD_PROJECT_DATA: ${{ secrets.REAL_WORLD_PROJECT_DATA }}
        run: docker run --rm --init --ipc=host \
              -e CI \
              -e REAL_WORLD_PROJECT_DATA \
              ai-driven-qa:ci