name: Run Tests from Container

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag — latest or commit SHA
        type: string
        required: true
        default: latest

jobs:
  run-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      report_uploaded: ${{ steps.pages-artifact.outcome }}
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      -
        name: Checkout Required Repository Files
        uses: actions/checkout@v7
        with:
          sparse-checkout: reports/index.html
          sparse-checkout-cone-mode: false
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - 
        name: Pull Image
        run: |
          echo "Pulling ghcr.io/marutsich/ai-driven-qa:$IMAGE_TAG"
          docker pull "ghcr.io/marutsich/ai-driven-qa:$IMAGE_TAG"
      - 
        name: Run container and execute Tests
        env:
          REAL_WORLD_PROJECT_DATA: ${{ secrets.REAL_WORLD_PROJECT_DATA }}
        run: |
          mkdir -p playwright-report test-results allure-results allure-report

          docker run --rm --init --ipc=host \
            -e CI \
            -e REAL_WORLD_PROJECT_DATA \
            --mount type=bind,source="$(pwd)/playwright-report",target=/app/playwright-report \
            --mount type=bind,source="$(pwd)/test-results",target=/app/test-results \
            --mount type=bind,source="$(pwd)/allure-results",target=/app/allure-results \
            --mount type=bind,source="$(pwd)/allure-report",target=/app/allure-report \
            "ghcr.io/marutsich/ai-driven-qa:$IMAGE_TAG"
      -
        name: Prepare Reports
        if: ${{ !cancelled() }}
        run: |
          mv allure-report reports/allure-report
          mv playwright-report reports/playwright-report
      -
        name: Upload Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          path: |
            reports
            test-results
            allure-results
          retention-days: 3
      -
        name: Prepare report for Pages
        id: pages-artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: reports
  publish-report:
    needs: run-tests
    if: ${{ !cancelled() && needs.run-tests.outputs.report_uploaded == 'success' }}
    runs-on: ubuntu-24.04

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - 
        name: Deploy report
        id: deployment
        uses: actions/deploy-pages@v4