name: Run Tests from Source

on: workflow_dispatch

jobs:
  run-tests:
    runs-on: ubuntu-24.04
    outputs:
      report_uploaded: ${{ steps.pages-artifact.outcome }}
    steps:
      -
        name: Checkout Repository
        uses: actions/checkout@v7
      -
        name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      -
        name: Install packages and dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      -
        name: Run Tests
        env:
          REAL_WORLD_PROJECT_DATA: ${{ secrets.REAL_WORLD_PROJECT_DATA }}
        run: npx allure run -- npm test
      -
        name: Prepare Reports
        if: ${{ !cancelled() }} 
        run: |
          mv allure-report reports/allure-report
          mv playwright-report reports/playwright-report
      -
        name: Upload Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          path: |
            reports
            test-results
            allure-results
          retention-days: 3
      -
        name: Prepare Report for Pages
        id: pages-artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: reports
  publish-report:
    needs: run-tests
    if: ${{ !cancelled() && needs.run-tests.outputs.report_uploaded == 'success' }}
    runs-on: ubuntu-24.04

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - 
        name: Deploy report
        id: deployment
        uses: actions/deploy-pages@v4