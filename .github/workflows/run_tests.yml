name: Run Tests

on: workflow_dispatch

jobs:
  run-tests:
    runs-on: ubuntu-24.04
    permissions:
      packages: read
    outputs:
      report_uploaded: ${{ steps.pages-artifact.outcome }}
    steps:
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - 
        name: Pull Image
        run: docker pull ghcr.io/marutsich/ai-driven-qa:latest
      - 
        name: Run container and execute Tests
        env:
          REAL_WORLD_PROJECT_DATA: ${{ secrets.REAL_WORLD_PROJECT_DATA }}
        run: |
          mkdir -p playwright-report test-results

          docker run --rm --init --ipc=host \
            -e CI \
            -e REAL_WORLD_PROJECT_DATA \
            --mount type=bind,source="$(pwd)/playwright-report",target=/app/playwright-report \
            --mount type=bind,source="$(pwd)/test-results",target=/app/test-results \
            ghcr.io/marutsich/ai-driven-qa:latest
      -
        name: Upload Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          path: |
            playwright-report
            test-results
          retention-days: 3
      -
        name: Prepare report for Pages
        id: pages-artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: playwright-report/
  publish-report:
    needs: run-tests
    if: ${{ !cancelled() && needs.run-tests.outputs.report_uploaded == 'success' }}
    runs-on: ubuntu-24.04

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - 
        name: Deploy report
        id: deployment
        uses: actions/deploy-pages@v4